<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
<title>유전율 측정 키트 — 개방단 동축 프로브와 VNA (단순화한 일러스트)</title>
<!-- VNA -->
<rect x="14" y="40" width="150" height="100" rx="8" fill="#eef2f8" stroke="#2d3548" stroke-width="2.5"/>
<rect x="26" y="52" width="92" height="60" rx="3" fill="#fff" stroke="#2d3548" stroke-width="1.5"/>
<path d="M30 70 C 60 72, 90 80, 114 90" stroke="#1f5fd1" stroke-width="2" fill="none"/>
<path d="M30 100 C 60 96, 90 92, 114 88" stroke="#d9731a" stroke-width="2" fill="none"/>
<text x="72" y="130" font-size="12" font-weight="700" fill="#2d3548" text-anchor="middle">VNA</text>
<circle cx="140" cy="96" r="9" fill="#fff" stroke="#2d3548" stroke-width="2.5"/><circle cx="140" cy="96" r="3" fill="#2d3548"/>
<!-- 케이블 -->
<path d="M140 105 C 140 190, 230 30, 270 40" fill="none" stroke="#2d3548" stroke-width="3"/>
<!-- 프로브 -->
<rect x="264" y="34" width="22" height="16" fill="#2d3548"/>
<rect x="268" y="50" width="14" height="110" fill="#eef2f8" stroke="#2d3548" stroke-width="2"/>
<rect x="262" y="160" width="26" height="8" fill="#fff" stroke="#2d3548" stroke-width="2"/>
<path d="M275 160 v8" stroke="#1f5fd1" stroke-width="3"/>
<!-- 비커 -->
<path d="M230 120 V230 a10 10 0 0 0 10 10 H310 a10 10 0 0 0 10 -10 V120" fill="none" stroke="#2d3548" stroke-width="2.5"/>
<path d="M232 150 H318 V230 a8 8 0 0 1 -8 8 H240 a8 8 0 0 1 -8 -8 Z" fill="#1f5fd1" fill-opacity="0.2"/>
<text x="262" y="214" font-size="11" fill="#1f5fd1" text-anchor="middle">조직등가액</text>
<!-- 온도계 -->
<rect x="302" y="96" width="8" height="120" rx="4" fill="#fff" stroke="#2d3548" stroke-width="1.5"/>
<circle cx="306" cy="220" r="7" fill="#d9731a"/><path d="M306 150 V216" stroke="#d9731a" stroke-width="3"/>
<text x="340" y="104" font-size="11" fill="#d9731a">온도계</text>
<!-- 결과 -->
<rect x="14" y="170" width="190" height="66" rx="6" fill="#fff" stroke="#1f5fd1" stroke-width="1.5"/>
<text x="24" y="192" font-size="12" fill="#2d3548">ε′ (비유전율) 목표 ± 허용</text>
<text x="24" y="212" font-size="12" fill="#2d3548">σ (도전율) 목표 ± 허용</text>
<text x="24" y="230" font-size="11" fill="#2d3548">예: 대표 허용차 ±5 % 이내</text>
<text x="368" y="160" font-size="12" font-weight="700" fill="#2d3548" text-anchor="middle">개방단</text>
<text x="368" y="176" font-size="12" font-weight="700" fill="#2d3548" text-anchor="middle">동축 프로브</text>
</svg>
