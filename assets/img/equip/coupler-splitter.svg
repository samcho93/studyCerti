<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
<title>방향성 결합기와 전력 분배기 (단순화한 일러스트)</title>
<!-- 방향성 결합기 -->
<rect x="40" y="40" width="140" height="60" rx="6" fill="#eef2f8" stroke="#2d3548" stroke-width="2.5"/>
<rect x="16" y="60" width="24" height="20" fill="#2d3548"/><rect x="180" y="60" width="24" height="20" fill="#2d3548"/>
<rect x="128" y="100" width="20" height="22" fill="#2d3548"/>
<path d="M50 62 h120" stroke="#1f5fd1" stroke-width="3"/>
<path d="M70 80 h80" stroke="#d9731a" stroke-width="2"/>
<text x="110" y="92" font-size="11" fill="#2d3548" text-anchor="middle">-20 dB</text>
<g font-size="12" font-weight="700" fill="#2d3548" text-anchor="middle">
<text x="28" y="32">IN</text><text x="192" y="32">OUT</text><text x="138" y="140">CPL</text>
</g>
<text x="110" y="170" font-size="15" font-weight="700" fill="#2d3548" text-anchor="middle">방향성 결합기</text>
<text x="110" y="190" font-size="12" fill="#2d3548" text-anchor="middle">주 경로는 거의 손실 없이 통과,</text>
<text x="110" y="206" font-size="12" fill="#2d3548" text-anchor="middle">일부(예: 1/100)만 CPL로 분기</text>
<!-- 전력 분배기 -->
<path d="M240 60 l60 -28 h60 v50 h-60 l-60 28 z" fill="none"/>
<rect x="250" y="40" width="110" height="80" rx="6" fill="#eef2f8" stroke="#2d3548" stroke-width="2.5"/>
<rect x="226" y="70" width="24" height="20" fill="#2d3548"/>
<rect x="360" y="48" width="24" height="18" fill="#2d3548"/><rect x="360" y="94" width="24" height="18" fill="#2d3548"/>
<path d="M258 80 h30 l30 -23 h36 M288 80 l30 23 h36" fill="none" stroke="#1f5fd1" stroke-width="3"/>
<g font-size="12" font-weight="700" fill="#2d3548" text-anchor="middle">
<text x="238" y="62">Σ</text><text x="372" y="40">1</text><text x="372" y="130">2</text>
</g>
<text x="310" y="170" font-size="15" font-weight="700" fill="#2d3548" text-anchor="middle">전력 분배기/합성기</text>
<text x="310" y="190" font-size="12" fill="#2d3548" text-anchor="middle">2-way: 각 출력 약 -3 dB</text>
<text x="310" y="206" font-size="12" fill="#2d3548" text-anchor="middle">(저항형은 약 -6 dB)</text>
</svg>
