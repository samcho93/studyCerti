<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
<title>LISN(AMN, 의사전원회로망) (단순화한 일러스트)</title>
<rect x="30" y="70" width="340" height="140" rx="8" fill="#eef2f8" stroke="#2d3548" stroke-width="2.5"/>
<rect x="30" y="210" width="340" height="12" fill="#2d3548"/>
<!-- EUT 콘센트 -->
<rect x="60" y="92" width="80" height="80" rx="10" fill="#fff" stroke="#2d3548" stroke-width="2"/>
<circle cx="100" cy="132" r="26" fill="#eef2f8" stroke="#2d3548" stroke-width="1.5"/>
<circle cx="90" cy="132" r="4" fill="#2d3548"/><circle cx="110" cy="132" r="4" fill="#2d3548"/>
<text x="100" y="190" font-size="13" font-weight="700" fill="#2d3548" text-anchor="middle">EUT</text>
<!-- L/N 스위치 -->
<rect x="170" y="104" width="60" height="30" rx="4" fill="#fff" stroke="#2d3548" stroke-width="2"/>
<rect x="174" y="108" width="26" height="22" rx="3" fill="#1f5fd1"/>
<text x="187" y="124" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L1</text>
<text x="215" y="124" font-size="12" font-weight="700" fill="#2d3548" text-anchor="middle">N</text>
<text x="200" y="152" font-size="11.5" fill="#2d3548" text-anchor="middle">측정 선로 선택</text>
<!-- RF OUT -->
<circle cx="290" cy="120" r="13" fill="#fff" stroke="#2d3548" stroke-width="2.5"/><circle cx="290" cy="120" r="4.5" fill="#2d3548"/>
<text x="290" y="150" font-size="12" font-weight="700" fill="#2d3548" text-anchor="middle">RF OUT</text>
<text x="290" y="166" font-size="11" fill="#1f5fd1" text-anchor="middle">→ EMI 수신기</text>
<!-- 접지 단자 -->
<circle cx="344" cy="186" r="7" fill="#fff" stroke="#1d8a55" stroke-width="2.5"/>
<text x="344" y="200" font-size="10" fill="#1d8a55" text-anchor="middle">GND</text>
<!-- 전원 입력 케이블 -->
<path d="M370 110 C 390 110, 392 60, 360 40 L 300 20" fill="none" stroke="#2d3548" stroke-width="3"/>
<text x="258" y="24" font-size="12" fill="#2d3548" text-anchor="middle">MAINS (AC 전원)</text>
<text x="200" y="56" font-size="14" font-weight="700" fill="#2d3548" text-anchor="middle">50 Ω / 50 µH</text>
<g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="56" cy="88" r="11" fill="#d9731a"/><text x="56" y="93">1</text>
<circle cx="166" cy="100" r="11" fill="#d9731a"/><text x="166" y="105">2</text>
<circle cx="314" cy="104" r="11" fill="#d9731a"/><text x="314" y="109">3</text>
</g>
</svg>
