<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
<title>DC 전원공급기 (단순화한 정면 일러스트)</title>
<rect x="20" y="40" width="360" height="180" rx="10" fill="#eef2f8" stroke="#2d3548" stroke-width="2.5"/>
<rect x="40" y="60" width="180" height="90" rx="4" fill="#fff" stroke="#2d3548" stroke-width="2"/>
<text x="210" y="96" font-size="28" font-weight="700" fill="#1f5fd1" text-anchor="end">3.80 V</text>
<text x="210" y="136" font-size="28" font-weight="700" fill="#d9731a" text-anchor="end">0.512 A</text>
<text x="50" y="80" font-size="11" fill="#2d3548">CV</text>
<g fill="#fff" stroke="#2d3548" stroke-width="2"><circle cx="266" cy="90" r="22"/><circle cx="334" cy="90" r="22"/></g>
<circle cx="272" cy="76" r="3" fill="#2d3548"/><circle cx="340" cy="76" r="3" fill="#2d3548"/>
<g font-size="12" font-weight="700" fill="#2d3548" text-anchor="middle"><text x="266" y="130">VOLTAGE</text><text x="334" y="130">CURRENT</text></g>
<rect x="40" y="170" width="70" height="30" rx="4" fill="#1f5fd1"/><text x="75" y="190" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">OUTPUT</text>
<g stroke-width="3"><circle cx="250" cy="185" r="12" fill="#fff" stroke="#d9731a"/><circle cx="300" cy="185" r="12" fill="#fff" stroke="#2d3548"/><circle cx="350" cy="185" r="10" fill="#fff" stroke="#1d8a55"/></g>
<g font-size="16" font-weight="700" text-anchor="middle"><text x="250" y="191" fill="#d9731a">+</text><text x="300" y="191" fill="#2d3548">−</text></g>
<text x="350" y="212" font-size="10" fill="#1d8a55" text-anchor="middle">GND</text>
<text x="170" y="190" font-size="11" fill="#2d3548" text-anchor="middle">배터리 대신 공급</text>
</svg>
