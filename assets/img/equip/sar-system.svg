<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
<title>SAR 측정 시스템 — 로봇, 프로브, 팬텀 (단순화한 일러스트)</title>
<!-- 로봇 -->
<rect x="20" y="196" width="80" height="44" rx="4" fill="#eef2f8" stroke="#2d3548" stroke-width="2.5"/>
<rect x="46" y="170" width="28" height="26" fill="#eef2f8" stroke="#2d3548" stroke-width="2"/>
<path d="M60 176 L96 88 L180 52" fill="none" stroke="#2d3548" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M60 176 L96 88 L180 52" fill="none" stroke="#eef2f8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="96" cy="88" r="11" fill="#fff" stroke="#2d3548" stroke-width="2.5"/>
<circle cx="180" cy="52" r="10" fill="#fff" stroke="#2d3548" stroke-width="2.5"/>
<rect x="190" y="44" width="30" height="18" rx="3" fill="#fff" stroke="#2d3548" stroke-width="2"/>
<!-- 프로브 -->
<path d="M220 53 L250 110" stroke="#2d3548" stroke-width="5"/>
<path d="M250 110 L262 136" stroke="#1f5fd1" stroke-width="4"/>
<circle cx="263" cy="138" r="4" fill="#1f5fd1"/>
<text x="286" y="98" font-size="12" font-weight="700" fill="#1f5fd1">E-field 프로브</text>
<!-- 팬텀 (평판) -->
<path d="M180 130 H380 L370 172 H190 Z" fill="#fff" stroke="#2d3548" stroke-width="2.5"/>
<path d="M186 146 H374 L370 170 H190 Z" fill="#1f5fd1" fill-opacity="0.18"/>
<text x="330" y="162" font-size="11" fill="#1f5fd1" text-anchor="middle">조직등가액</text>
<path d="M190 172 V230 M370 172 V230" stroke="#2d3548" stroke-width="3"/>
<rect x="176" y="228" width="208" height="8" fill="#2d3548"/>
<!-- 단말 + 홀더 -->
<rect x="236" y="176" width="70" height="12" rx="3" fill="#d9731a"/>
<text x="271" y="206" font-size="11" fill="#2d3548" text-anchor="middle">시험 단말 + 기기 홀더</text>
<path d="M271 188 V196" stroke="#2d3548" stroke-width="1.5"/>
<text x="60" y="224" font-size="13" font-weight="700" fill="#2d3548" text-anchor="middle">로봇</text>
<text x="276" y="124" font-size="12" font-weight="700" fill="#2d3548">평판 팬텀</text>
<g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="120" cy="40" r="11" fill="#d9731a"/><text x="120" y="45">1</text>
<circle cx="236" cy="96" r="11" fill="#d9731a"/><text x="236" y="101">2</text>
<circle cx="392" cy="138" r="7" fill="none"/>
</g>
</svg>
