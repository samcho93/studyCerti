<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
<title>대표적인 RF 커넥터 (단순화한 일러스트, 크기 비례는 대략적)</title>
<!-- N -->
<g transform="translate(60 90)">
<circle r="42" fill="#eef2f8" stroke="#2d3548" stroke-width="2.5"/>
<circle r="28" fill="#fff" stroke="#2d3548" stroke-width="2"/>
<circle r="5" fill="#d9731a"/>
</g>
<text x="60" y="160" font-size="15" font-weight="700" fill="#2d3548" text-anchor="middle">N형</text>
<text x="60" y="178" font-size="11" fill="#2d3548" text-anchor="middle">~18 GHz (정밀형)</text>
<!-- SMA -->
<g transform="translate(160 90)">
<polygon points="26,0 13,22.5 -13,22.5 -26,0 -13,-22.5 13,-22.5" fill="#eef2f8" stroke="#2d3548" stroke-width="2.5"/>
<circle r="14" fill="#fff" stroke="#2d3548" stroke-width="2"/>
<circle r="3" fill="#d9731a"/>
</g>
<text x="160" y="160" font-size="15" font-weight="700" fill="#2d3548" text-anchor="middle">SMA</text>
<text x="160" y="178" font-size="11" fill="#2d3548" text-anchor="middle">~18 GHz 전후</text>
<!-- 3.5 / 2.92 -->
<g transform="translate(250 90)">
<polygon points="24,0 12,20.8 -12,20.8 -24,0 -12,-20.8 12,-20.8" fill="#eef2f8" stroke="#1f5fd1" stroke-width="2.5"/>
<circle r="13" fill="#fff" stroke="#1f5fd1" stroke-width="2"/>
<circle r="2.5" fill="#d9731a"/>
</g>
<text x="250" y="160" font-size="15" font-weight="700" fill="#1f5fd1" text-anchor="middle">3.5 / 2.92 mm</text>
<text x="250" y="178" font-size="11" fill="#2d3548" text-anchor="middle">~26.5 / ~40 GHz</text>
<!-- BNC -->
<g transform="translate(345 90)">
<circle r="26" fill="#eef2f8" stroke="#2d3548" stroke-width="2.5"/>
<circle r="16" fill="#fff" stroke="#2d3548" stroke-width="2"/>
<rect x="-30" y="-4" width="8" height="8" fill="#2d3548"/><rect x="22" y="-4" width="8" height="8" fill="#2d3548"/>
<circle r="3" fill="#d9731a"/>
</g>
<text x="345" y="160" font-size="15" font-weight="700" fill="#2d3548" text-anchor="middle">BNC</text>
<text x="345" y="178" font-size="11" fill="#2d3548" text-anchor="middle">저주파·트리거</text>
<text x="200" y="226" font-size="12" fill="#2d3548" text-anchor="middle">사용 상한 주파수는 제조사·등급마다 다름 — 사양서 확인</text>
<text x="200" y="244" font-size="12" fill="#1f5fd1" text-anchor="middle">SMA · 3.5 mm · 2.92 mm는 나사산 호환(주의해서 체결)</text>
</svg>
